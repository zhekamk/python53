    <style>

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }


        .earth-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 50px auto;
            border-radius: 50%;

            background: url('https://upload.wikimedia.org');
            background-size: cover;

            box-shadow: inset -30px -30px 50px #000, 0 0 50px rgba(70, 130, 180, 0.4);

            animation: rotateEarth 15s linear infinite;
        }


        .earth-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: inset 10px 10px 20px rgba(255, 255, 255, 0.2);
            z-index: 2;
        }


        @keyframes rotateEarth {
            from { background-position: 0 0; }
            to { background-position: 630px 0; } /* Ширина картинки для повного циклу */
        }


        .stars-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://s3-us-west-2.amazonaws.com') repeat;
            z-index: -1;
            opacity: 0.4;
        }
    </style>


</head>
